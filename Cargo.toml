[package]
name = "twitch-discord-summarizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Production-grade Twitch -> Discord live stream summarizer (one stream per process)."

[dependencies]
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "process",
    "sync",
    "time",
    "io-util",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "multipart",
    "form",
    "query",
    "rustls",
    "webpki-roots",
    "http2",
    "charset",
] }
twitch-irc = { version = "6", default-features = false, features = [
    "transport-tcp",
    "transport-tcp-rustls-webpki-roots",
] }

[dev-dependencies]
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
] }

[profile.release]
# Footprint-first build: optimize for size, single codegen unit, LTO, stripped.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# IMPORTANT: keep the default panic = "unwind". The supervisor catches worker
# panics via JoinHandle and restarts them; panic = "abort" would crash the
# whole process and defeat task-level supervision (design ss5).
